<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracking QA Settings</title>
  <link rel="stylesheet" href="../sidepanel/sidepanel.css">
  <style>
    body { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
    label { display: block; font-weight: 600; margin: 14px 0 4px; }
    input[type=text] { width: 100%; font: inherit; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
    #logo-preview { max-height: 48px; display: block; margin-top: 8px; }
    fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 4px 14px 14px; margin: 18px 0; }
    legend { font-weight: 650; padding: 0 6px; }
    .locked { opacity: .55; pointer-events: none; }
  </style>
</head>
<body>
  <h1 style="font-size:18px">Tracking QA settings</h1>

  <fieldset>
    <legend>Plan</legend>
    <p>Current plan: <strong id="plan-name">—</strong></p>
    <p class="hint">Pro ($15/mo): white-label reports (your logo, colours, no watermark), 50-page scans, 500 saved audits.</p>
    <div id="dev-toggle" hidden>
      <label><input type="checkbox" id="dev-pro"> Developer: enable Pro (unpacked installs only)</label>
    </div>
  </fieldset>

  <fieldset id="branding">
    <legend>Report branding <span class="badge pro">Pro</span></legend>
    <label for="agencyName">Agency name</label>
    <input type="text" id="agencyName">
    <label for="contact">Contact line</label>
    <input type="text" id="contact" placeholder="hello@agency.com · agency.com">
    <label for="preparedFor">Default "Prepared for"</label>
    <input type="text" id="preparedFor" placeholder="Client name">
    <label for="brandColor">Brand colour</label>
    <input type="color" id="brandColor">
    <label for="logo">Logo</label>
    <input type="file" id="logo" accept="image/png,image/jpeg,image/svg+xml">
    <div class="hint">PNG, JPG or SVG, max 300 KB.</div>
    <img id="logo-preview" alt="" hidden>
    <div class="row"><button class="secondary" id="clear-logo">Remove logo</button></div>
  </fieldset>

  <div class="row"><button class="primary" id="save">Save</button><span id="status" class="muted small"></span></div>
  <script type="module" src="options.js"></script>
</body>
</html>
